<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082"/>
      <stop offset="50%" stop-color="#E5A638"/>
      <stop offset="100%" stop-color="#B87B18"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#5856D6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Subtle Glowing Orbs -->
  <circle cx="160" cy="180" r="120" fill="#007AFF" opacity="0.18" filter="url(#glow)"/>
  <circle cx="360" cy="340" r="110" fill="#E5A638" opacity="0.15" filter="url(#glow)"/>
  
  <!-- USC Badge Circle -->
  <g transform="translate(160, 200)">
    <circle cx="0" cy="0" r="85" fill="#1C1C1E" stroke="url(#blueGrad)" stroke-width="6"/>
    <text x="0" y="16" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="52" font-weight="800" fill="url(#blueGrad)" text-anchor="middle" letter-spacing="1">USC</text>
  </g>
  
  <!-- Arrow / Exchange Node -->
  <g transform="translate(256, 256)" stroke="#8E8E93" stroke-width="6" stroke-linecap="round">
    <path d="M -25 -15 L 25 -15 M 15 -25 L 25 -15 L 15 -5" stroke="url(#blueGrad)" />
    <path d="M 25 15 L -25 15 M -15 25 L -25 15 L -15 5" stroke="url(#goldGrad)" />
  </g>
  
  <!-- THB Badge Circle -->
  <g transform="translate(352, 312)">
    <circle cx="0" cy="0" r="85" fill="#1C1C1E" stroke="url(#goldGrad)" stroke-width="6"/>
    <text x="0" y="22" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="70" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">฿</text>
  </g>
  
  <!-- Subtitle Tag -->
  <text x="256" y="445" font-family="-apple-system, SF Pro Text, sans-serif" font-size="24" font-weight="600" fill="#8E8E93" text-anchor="middle" letter-spacing="2">1 USC ≈ 0.3381 ฿</text>
</svg>
